<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Kasr Al Ainy Study Archive</title>
  <style>
    :root{
      --parchment:#f1ecdf;--paper:#fffdf7;--paper-raised:#fffefa;--paper-inset:#ebe5d8;
      --ink:#192733;--ink-2:#3d4a53;--ink-3:#6f7779;--line:rgba(25,39,51,.12);--line-soft:rgba(25,39,51,.075);
      --kasr:#7b1836;--kasr-deep:#5f1028;--kasr-tint:#f5e8ec;--sage:#56705d;--sage-tint:#e8f0e9;
      --amber:#a66a25;--amber-tint:#f7eddc;--danger:#a9433d;--focus:#b45a76;
      --radius-sm:7px;--radius-md:11px;--radius-lg:16px;--shadow:0 0 0 1px rgba(25,39,51,.045),0 1px 2px rgba(25,39,51,.04),0 6px 24px rgba(25,39,51,.045);
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{background:var(--parchment);color:var(--ink);font-family:"Avenir Next","Segoe UI",Tahoma,Arial,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
    button,input,select{font:inherit;color:inherit}
    button,a,select,input{outline:none}
    button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{box-shadow:0 0 0 3px rgba(180,90,118,.28)}
    button{cursor:pointer}
    .app{height:100%;display:grid;grid-template-rows:auto 1fr}
    .topbar{display:grid;grid-template-columns:280px minmax(300px,1fr) auto;align-items:center;gap:16px;padding:12px 16px;background:rgba(255,253,247,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(18px);z-index:20}
    .brand{display:flex;align-items:center;gap:11px;min-width:0}
    .seal{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--kasr);color:#fff;font-family:"Iowan Old Style",Georgia,serif;font-size:19px;font-weight:700;box-shadow:inset 0 0 0 4px rgba(255,255,255,.17)}
    .brand-copy{min-width:0}
    .brand-copy strong{display:block;font-family:"Iowan Old Style",Georgia,serif;font-size:17px;line-height:1.05;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .brand-copy span{display:block;margin-top:2px;color:var(--ink-3);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
    .search-wrap{position:relative}
    .search-wrap:before{content:"⌕";position:absolute;left:13px;top:8px;color:var(--ink-3);font-size:18px;pointer-events:none}
    html[dir=rtl] .search-wrap:before{left:auto;right:13px}
    .search{width:100%;height:40px;padding:0 40px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--paper-inset);transition:border-color .15s ease,background .15s ease}
    .search:focus{border-color:rgba(123,24,54,.42);background:var(--paper)}
    .top-actions{display:flex;align-items:center;gap:8px}
    .icon-btn,.text-btn{height:40px;border:1px solid var(--line);background:var(--paper);border-radius:var(--radius-sm);font-weight:650}
    .icon-btn{min-width:40px;padding:0 10px}
    .text-btn{padding:0 13px}
    .text-btn.primary{background:var(--kasr);border-color:var(--kasr);color:#fff}
    .shell{min-height:0;display:grid;grid-template-columns:280px minmax(420px,1fr) 340px}
    .sidebar,.details{min-height:0;background:var(--paper);overflow:auto}
    .sidebar{border-inline-end:1px solid var(--line)}
    .details{border-inline-start:1px solid var(--line)}
    .pane-head{position:sticky;top:0;z-index:5;padding:14px 16px;background:rgba(255,253,247,.94);border-bottom:1px solid var(--line-soft);backdrop-filter:blur(14px)}
    .eyebrow{margin:0;color:var(--kasr);font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
    .pane-head h2{margin:4px 0 0;font-family:"Iowan Old Style",Georgia,serif;font-size:21px;line-height:1.15;letter-spacing:-.02em}
    .quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:12px 12px 4px}
    .quick{min-height:58px;padding:9px 10px;text-align:left;border:1px solid var(--line-soft);border-radius:var(--radius-md);background:var(--paper-raised)}
    html[dir=rtl] .quick{text-align:right}
    .quick:hover,.quick.active{border-color:rgba(123,24,54,.28);background:var(--kasr-tint)}
    .quick span{display:block;color:var(--ink-3);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.055em}
    .quick strong{display:block;margin-top:2px;font-size:13px}
    .tree{padding:8px 10px 24px}
    details.tree-group{border-bottom:1px solid var(--line-soft)}
    details.tree-group>summary{list-style:none;display:flex;align-items:center;min-height:42px;padding:4px 6px;gap:8px;cursor:pointer;font-weight:720}
    details.tree-group>summary::-webkit-details-marker{display:none}
    details.tree-group>summary:before{content:"›";color:var(--kasr);font-size:18px;transition:transform .16s ease}
    details.tree-group[open]>summary:before{transform:rotate(90deg)}
    html[dir=rtl] details.tree-group[open]>summary:before{transform:rotate(-90deg)}
    .tree-items{padding:0 0 8px 22px}
    html[dir=rtl] .tree-items{padding:0 22px 8px 0}
    .tree-button{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:36px;padding:6px 8px;border:0;border-radius:var(--radius-sm);background:transparent;text-align:left;color:var(--ink-2)}
    html[dir=rtl] .tree-button{text-align:right}
    .tree-button:hover,.tree-button.active{background:var(--paper-inset);color:var(--ink)}
    .count{font-variant-numeric:tabular-nums;color:var(--ink-3);font-size:11px}
    .workspace{min-width:0;min-height:0;display:grid;grid-template-rows:auto auto minmax(0,1fr);background:var(--parchment)}
    .workspace-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 18px;background:var(--paper);border-bottom:1px solid var(--line)}
    .breadcrumbs{min-width:0}
    .breadcrumbs small{display:block;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .breadcrumbs h1{margin:3px 0 0;font-family:"Iowan Old Style",Georgia,serif;font-size:22px;line-height:1.15;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .view-tabs{display:flex;padding:3px;background:var(--paper-inset);border-radius:9px}
    .view-tab{height:32px;padding:0 11px;border:0;border-radius:7px;background:transparent;color:var(--ink-2);font-size:12px;font-weight:700}
    .view-tab.active{background:var(--paper);color:var(--kasr);box-shadow:0 1px 4px rgba(25,39,51,.1)}
    .filters{display:flex;align-items:center;gap:7px;padding:9px 18px;background:var(--paper);border-bottom:1px solid var(--line-soft);overflow:auto}
    select{height:34px;padding:0 30px 0 10px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--paper-raised);font-size:12px}
    html[dir=rtl] select{padding:0 10px 0 30px}
    .result-count{margin-inline-start:auto;color:var(--ink-3);font-size:11px;white-space:nowrap;font-variant-numeric:tabular-nums}
    .library-view{min-height:0;display:grid;grid-template-columns:minmax(260px,36%) minmax(0,1fr)}
    .results{overflow:auto;padding:12px}
    .record{position:relative;width:100%;margin:0 0 8px;padding:12px 13px 11px;border:1px solid var(--line-soft);border-radius:var(--radius-md);background:var(--paper);text-align:left;box-shadow:0 1px 2px rgba(25,39,51,.02)}
    html[dir=rtl] .record{text-align:right}
    .record:hover,.record.active{border-color:rgba(123,24,54,.27);box-shadow:var(--shadow)}
    .record.active:before{content:"";position:absolute;inset-block:9px;inset-inline-start:-1px;width:3px;border-radius:0 3px 3px 0;background:var(--kasr)}
    .record-title{display:flex;align-items:flex-start;gap:8px;font-weight:720;line-height:1.3}
    .record-title span:first-child{flex:1}
    .record-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
    .badge{display:inline-flex;align-items:center;min-height:22px;padding:2px 7px;border-radius:999px;background:var(--paper-inset);color:var(--ink-2);font-size:10px;font-weight:750}
    .badge.current{background:var(--sage-tint);color:var(--sage)}
    .badge.legacy,.badge.pending{background:var(--amber-tint);color:var(--amber)}
    .badge.important{background:var(--kasr-tint);color:var(--kasr)}
    .star{width:28px;height:28px;border:0;background:transparent;color:var(--ink-3);font-size:18px;line-height:1}
    .star.on{color:var(--amber)}
    .viewer{min-width:0;min-height:0;padding:12px 12px 12px 0}
    html[dir=rtl] .viewer{padding:12px 0 12px 12px}
    .viewer-frame{height:100%;min-height:360px;display:flex;flex-direction:column;border-radius:var(--radius-lg);background:var(--paper);box-shadow:var(--shadow);overflow:hidden}
    .viewer-tools{display:flex;align-items:center;gap:7px;min-height:48px;padding:7px 10px;border-bottom:1px solid var(--line-soft)}
    .viewer-tools .filename{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
    .page-input{width:64px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--cream);color:var(--ink);padding:0 8px;font:700 12px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace}
    .viewer-body{flex:1;min-height:0;background:#d8d3ca}
    .viewer-body iframe{display:block;width:100%;height:100%;border:0;background:#fff}
    .empty{height:100%;display:grid;place-items:center;padding:36px;text-align:center;background:var(--paper)}
    .empty-mark{width:74px;height:92px;margin:auto;border:1px solid var(--line);border-radius:6px 12px 12px 6px;background:var(--paper-raised);box-shadow:inset 9px 0 0 var(--kasr-tint),var(--shadow);position:relative}
    .empty-mark:after{content:"KA";position:absolute;inset:0;display:grid;place-items:center;color:var(--kasr);font-family:"Iowan Old Style",Georgia,serif;font-size:22px;font-weight:700}
    .empty h3{margin:16px 0 5px;font-family:"Iowan Old Style",Georgia,serif;font-size:22px}
    .empty p{max-width:420px;margin:0;color:var(--ink-3)}
    .calendar-view{display:none;min-height:0;grid-template-columns:minmax(0,1fr) 300px;padding:12px;gap:12px}
    .calendar-view.active{display:grid}
    .calendar-card,.agenda{min-height:0;background:var(--paper);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:auto}
    .calendar-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line-soft)}
    .calendar-head h3{margin:0;font-family:"Iowan Old Style",Georgia,serif;font-size:20px}
    .calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);padding:8px}
    .weekday{padding:7px;color:var(--ink-3);font-size:10px;font-weight:800;text-align:center;text-transform:uppercase;letter-spacing:.08em}
    .day{min-height:92px;padding:7px;border-top:1px solid var(--line-soft);border-inline-start:1px solid var(--line-soft);background:var(--paper)}
    .day.outside{color:#aaa;background:rgba(235,229,216,.34)}
    .day-number{font-size:11px;font-weight:750;font-variant-numeric:tabular-nums}
    .event{display:block;width:100%;margin-top:4px;padding:4px 5px;border:0;border-radius:5px;background:var(--sage-tint);color:var(--sage);font-size:9px;font-weight:750;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .event.exam{background:var(--kasr-tint);color:var(--kasr)}
    .event.archive{background:var(--amber-tint);color:var(--amber);border:1px dashed rgba(166,106,37,.35)}
    .agenda{padding:14px}
    .agenda h3{margin:0 0 12px;font-family:"Iowan Old Style",Georgia,serif;font-size:18px}
    .agenda-item{padding:10px 0;border-bottom:1px solid var(--line-soft)}
    .agenda-item time{color:var(--kasr);font-size:10px;font-weight:800}
    .agenda-item strong{display:block;margin-top:2px}
    .messages-view{display:none;min-height:0;grid-template-columns:286px minmax(0,1fr);gap:12px;padding:12px;overflow:hidden}
    .messages-view.active{display:grid}
    .message-index,.message-stage{min-height:0;border-radius:var(--radius-lg);background:var(--paper);box-shadow:var(--shadow);overflow:auto}
    .message-index{padding:14px}
    .message-index-head{position:sticky;top:-14px;z-index:2;margin:-14px -14px 12px;padding:14px;background:rgba(255,253,247,.96);border-bottom:1px solid var(--line-soft);backdrop-filter:blur(12px)}
    .message-index-head h3{margin:3px 0 0;font-family:"Iowan Old Style",Georgia,serif;font-size:20px}
    .cohort-block{margin-top:16px}
    .cohort-block h4{display:flex;align-items:center;gap:8px;margin:0 0 7px;color:var(--kasr);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
    .cohort-block h4:after{content:"";height:1px;flex:1;background:var(--line)}
    .message-root{display:block;width:100%;margin:0 0 7px;padding:10px;border:1px solid var(--line-soft);border-radius:var(--radius-sm);background:var(--paper-raised);text-align:left}
    html[dir=rtl] .message-root{text-align:right}
    .message-root:hover,.message-root.active{border-color:rgba(123,24,54,.32);background:var(--kasr-tint)}
    .message-root strong{display:block;line-height:1.25}
    .message-root span{display:block;margin-top:4px;color:var(--ink-3);font-size:10px}
    .message-stage{position:relative;padding:0 20px 26px}
    .message-trail{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:9px;min-height:58px;margin:0 -20px;padding:9px 20px;background:rgba(255,253,247,.96);border-bottom:1px solid var(--line-soft);backdrop-filter:blur(12px)}
    .message-trail .trail-copy{flex:1;min-width:0}
    .message-trail small{display:block;color:var(--ink-3);font-size:10px;font-weight:750;text-transform:uppercase;letter-spacing:.07em}
    .message-trail strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .message-sheet{position:relative;max-width:840px;margin:22px auto 0;padding:26px 28px 30px;border:1px solid var(--line);border-radius:4px 14px 14px 4px;background:var(--paper-raised);box-shadow:inset 10px 0 0 var(--kasr-tint),0 12px 34px rgba(25,39,51,.06)}
    html[dir=rtl] .message-sheet{border-radius:14px 4px 4px 14px;box-shadow:inset -10px 0 0 var(--kasr-tint),0 12px 34px rgba(25,39,51,.06)}
    .message-sheet:before{content:"";position:absolute;inset-block:24px 30px;inset-inline-start:21px;width:2px;background:var(--kasr)}
    .message-heading{padding-inline-start:20px}
    .message-heading .eyebrow{display:flex;align-items:center;gap:8px}
    .message-heading h2{margin:7px 0 4px;font-family:"Iowan Old Style",Georgia,serif;font-size:26px;line-height:1.15}
    .message-heading p{margin:0;color:var(--ink-3);font-size:11px}
    .message-copy{margin:22px 0 0;padding:18px 18px 18px 30px;border:1px solid var(--line-soft);border-radius:var(--radius-md);background:var(--paper);white-space:pre-wrap;overflow-wrap:anywhere;font-family:"Avenir Next","Segoe UI",Tahoma,Arial,sans-serif;line-height:1.65}
    html[dir=rtl] .message-copy{padding:18px 30px 18px 18px}
    .message-inline{display:inline-flex;align-items:center;max-width:100%;padding:2px 6px;border:0;border-bottom:1px solid currentColor;background:var(--kasr-tint);color:var(--kasr);font:700 12px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;text-decoration:none;overflow-wrap:anywhere;cursor:pointer}
    .message-pending{margin-top:20px;padding:15px 16px;border:1px dashed rgba(166,106,37,.42);border-radius:var(--radius-md);background:var(--amber-tint);color:var(--amber)}
    .message-pending strong{display:block;margin-bottom:3px}
    .message-section{margin-top:22px;padding-inline-start:20px}
    .message-section h3{margin:0 0 9px;color:var(--ink-3);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
    .message-link-list{display:grid;gap:7px}
    .message-link{position:relative;display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:9px;width:100%;min-height:50px;padding:7px 9px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--paper);text-align:left;text-decoration:none;color:var(--ink)}
    html[dir=rtl] .message-link{text-align:right}
    .message-link:hover{border-color:rgba(123,24,54,.34);background:var(--kasr-tint)}
    .thread-node{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--kasr);color:#fff;font-size:11px;font-weight:800}
    .message-link small{display:block;color:var(--ink-3);font-size:10px}
    .message-link .arrow{color:var(--kasr);font-size:18px}
    .details-body{padding:14px 16px 30px}
    .provenance-ribbon{position:relative;padding:13px 13px 13px 17px;border-radius:var(--radius-md);background:var(--kasr-tint);overflow:hidden}
    html[dir=rtl] .provenance-ribbon{padding:13px 17px 13px 13px}
    .provenance-ribbon:before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:5px;background:var(--kasr)}
    .provenance-ribbon small{display:block;color:var(--kasr);font-size:9px;font-weight:850;letter-spacing:.1em;text-transform:uppercase}
    .provenance-ribbon strong{display:block;margin-top:3px}
    .detail-section{padding:14px 0;border-bottom:1px solid var(--line-soft)}
    .detail-section h3{margin:0 0 8px;color:var(--ink-3);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
    .detail-section p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink-2)}
    .definition{display:grid;grid-template-columns:98px 1fr;gap:7px 10px;margin:0}
    .definition dt{color:var(--ink-3);font-size:11px}
    .definition dd{margin:0;font-weight:650;overflow-wrap:anywhere}
    .source-link{display:flex;align-items:center;justify-content:space-between;min-height:42px;padding:7px 10px;border:1px solid var(--line);border-radius:var(--radius-sm);color:var(--kasr);font-weight:700;text-decoration:none}
    .source-link:hover{background:var(--kasr-tint)}
    .personal-shelves{margin:10px 10px 2px;border:1px solid var(--line);border-radius:var(--radius-md);background:linear-gradient(180deg,var(--paper-raised),var(--paper));box-shadow:0 1px 2px rgba(25,39,51,.03);overflow:hidden}
    .shelf-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 10px 8px;border-bottom:1px solid var(--line-soft)}
    .shelf-head div{min-width:0}
    .shelf-head small{display:block;color:var(--kasr);font-size:9px;font-weight:850;letter-spacing:.1em;text-transform:uppercase}
    .shelf-head strong{display:block;margin-top:1px;font-family:"Iowan Old Style",Georgia,serif;font-size:16px}
    .shelf-add{width:30px;height:30px;border:1px solid var(--line);border-radius:50%;background:var(--paper);color:var(--kasr);font-size:19px;line-height:1}
    .shelf-add:hover{border-color:rgba(123,24,54,.32);background:var(--kasr-tint)}
    .folder-tree{padding:5px}
    .folder-empty{padding:12px 10px;color:var(--ink-3);font-size:11px;line-height:1.45}
    .folder-row{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 28px;align-items:center;gap:3px;margin:1px 0;padding-inline-start:calc(var(--folder-depth,0) * 15px)}
    .folder-row:before{content:"";position:absolute;inset-inline-start:calc(var(--folder-depth,0) * 15px + 3px);top:9px;width:6px;height:18px;border-inline-start:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0 0 0 4px;opacity:calc(min(var(--folder-depth,0),1))}
    .folder-open{display:grid;grid-template-columns:11px minmax(0,1fr) auto;align-items:center;gap:7px;min-height:35px;padding:5px 6px;border:0;border-radius:7px;background:transparent;text-align:left}
    html[dir=rtl] .folder-open{text-align:right}
    .folder-open:hover,.folder-open.active{background:color-mix(in srgb,var(--folder-color) 11%,var(--paper-inset))}
    .folder-tab{width:9px;height:24px;border-radius:2px 5px 5px 2px;background:var(--folder-color);box-shadow:inset -2px 0 rgba(255,255,255,.2)}
    html[dir=rtl] .folder-tab{border-radius:5px 2px 2px 5px}
    .folder-name{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;font-weight:700}
    .folder-count{color:var(--ink-3);font-size:10px;font-variant-numeric:tabular-nums}
    .folder-edit{width:28px;height:28px;border:0;border-radius:7px;background:transparent;color:var(--ink-3)}
    .folder-edit:hover{background:var(--paper-inset);color:var(--kasr)}
    .folder-note{max-width:700px;margin:4px 0 0;color:var(--ink-3);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .record-folder{display:inline-flex;align-items:center;gap:4px;color:var(--ink-3);font-size:10px;font-weight:700}
    .record-folder:before{content:"";width:7px;height:13px;border-radius:2px 4px 4px 2px;background:var(--folder-color,var(--kasr))}
    .detail-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
    .detail-action{min-height:40px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--paper);font-size:11px;font-weight:750}
    .detail-action:hover{border-color:rgba(123,24,54,.34);background:var(--kasr-tint)}
    .folder-chips{display:flex;flex-wrap:wrap;gap:6px}

      else if(record){action='data-record="'+esc(record.id)+'"';kind=tr('openDocument')}
      if(action)return '<button class="message-link" type="button" '+action+'><span class="thread-node">'+(reference.targetMessageId?'↳':'▣')+'</span><span><strong>'+esc(reference.label||reference.href)+'</strong><small>'+esc(kind)+'</small></span><span class="arrow">›</span></button>';
      return '<a class="message-link" href="'+esc(reference.href)+'" target="_blank" rel="noopener"><span class="thread-node">↗</span><span><strong>'+esc(reference.label||reference.href)+'</strong><small>Telegram</small></span><span class="arrow">›</span></a>';
    }
    function bindMessageActions(container){
      container.querySelectorAll('[data-message]').forEach(function(button){button.onclick=function(){openMessage(button.dataset.message,true)}});
      container.querySelectorAll('[data-record]').forEach(function(button){button.onclick=function(){var record=records.find(function(item){return item.id===button.dataset.record});if(record){setView('library');selectRecord(record)}}});
      var back=container.querySelector('[data-message-back]');if(back)back.onclick=backMessage;
      var original=container.querySelector('[data-message-original]');if(original)original.onclick=function(){var root=state.messageHistory[0];if(root){state.messageHistory=[];state.messageId=root;persist();renderMessages()}};
    }
    function openMessage(id,pushHistory){
      if(!messageById.has(id))return;
      if(pushHistory&&state.messageId&&state.messageId!==id)state.messageHistory.push(state.messageId);
      state.messageId=id;persist();renderMessages();
    }
    function backMessage(){
      var previous=state.messageHistory.pop();if(!previous)return;state.messageId=previous;persist();renderMessages();
    }
    function renderMessages(){
      var query=normalize(state.query),scope=(messages.messages||[]).filter(function(message){return [200,199,198].includes(Number(message.sourceBatch))});
      var visible=scope.filter(function(message){return !query||normalize([message.title,message.exactText,message.module,message.telegramUrl,message.sourceBatch].join(' ')).includes(query)});
      $('messageIndex').innerHTML=[200,199,198].map(function(batch){
        var cohort=visible.filter(function(message){return Number(message.sourceBatch)===batch});
        if(!cohort.length)return '';
        return '<section class="message-cohort"><h3>Batch '+batch+'</h3>'+cohort.map(function(message){return '<button class="message-index-item '+(message.id===state.messageId?'active':'')+'" type="button" data-message="'+esc(message.id)+'"><span>'+esc(message.title)+'</span><small>Year '+esc(message.year||'—')+(message.module?' · '+esc(message.module):'')+'</small></button>'}).join('')+'</section>';
      }).join('')||'<div class="empty"><p>'+esc(tr('noResults'))+'</p></div>';
      bindMessageActions($('messageIndex'));
      var message=messageById.get(state.messageId)||messageById.get(messages.roots[0]);
      if(!message){$('messageStage').innerHTML='<div class="empty"><h3>'+esc(tr('noResults'))+'</h3></div>';return}
      state.messageId=message.id;
      var verified=message.exactTextStatus&&message.exactTextStatus.indexOf('verified_')===0;
      var attachmentEndpoint=message.exactTextStatus==='verified_public_attachment_or_media_endpoint';
      var transcript=message.exactText?'<div class="message-copy" dir="auto">'+renderMessageText(message)+'</div>':attachmentEndpoint?'<div class="message-pending"><strong>'+esc(tr('attachmentEndpoint'))+'</strong><span>'+esc(tr('attachmentNoCaption'))+'</span></div>':'<div class="message-pending"><strong>'+esc(tr('pendingLabel'))+'</strong><span>'+esc(tr('exactPending'))+'</span></div>';
      if(message.exactTextNote)transcript+='<div class="message-pending"><strong>'+esc(tr(attachmentEndpoint?'attachmentEndpoint':'partialText'))+'</strong><span>'+esc(message.exactTextNote)+'</span></div>';
      var references=(message.references||[]).map(messageLink).join('');
      var directRecords=(message.recordIds||[]).map(function(id){return records.find(function(record){return record.id===id})}).filter(function(record){return record&&record.disposition!=='orientation_index'});
      var files=directRecords.map(function(record){return '<button class="message-link" type="button" data-record="'+esc(record.id)+'"><span class="thread-node">▣</span><span><strong>'+esc(record.title||record.originalFilename)+'</strong><small>'+esc(record.category||tr('openDocument'))+'</small></span><span class="arrow">›</span></button>'}).join('');
      $('messageStage').innerHTML='<div class="message-trail">'+(state.messageHistory.length?'<button class="text-btn" type="button" data-message-back>‹ '+esc(tr('backMessage'))+'</button>':'')+(state.messageHistory.length>1?'<button class="text-btn" type="button" data-message-original>'+esc(tr('backOriginal'))+'</button>':'')+'<div class="trail-copy"><small>Batch '+esc(message.sourceBatch||'—')+' · Year '+esc(message.year||'—')+'</small><strong>'+esc(message.title)+'</strong></div><a class="text-btn" href="'+esc(message.telegramUrl)+'" target="_blank" rel="noopener">Telegram ↗</a></div><article class="message-sheet"><header class="message-header"><p class="eyebrow">'+esc(attachmentEndpoint?tr('attachmentEndpoint'):verified?tr('exactVerified'):tr('pendingLabel'))+'</p><h2>'+esc(message.title)+'</h2><p>'+esc(message.module||'Batch '+message.sourceBatch)+'</p></header>'+transcript+(references?'<section class="message-references"><h3>'+esc(tr('messageReferences'))+'</h3><div class="message-link-list">'+references+'</div></section>':'')+(files?'<section class="message-references"><h3>'+esc(tr('messageFiles'))+'</h3><div class="message-link-list">'+files+'</div></section>':'')+'</article>';
      bindMessageActions($('messageStage'));
    }
    function setView(view){
      state.view=view;
      ['library','messages','calendar'].forEach(function(name){var tab=$(name+'Tab');tab.classList.toggle('active',view===name);tab.setAttribute('aria-selected',view===name)});
      $('filters').hidden=view!=='library';$('libraryView').hidden=view!=='library';$('messagesView').classList.toggle('active',view==='messages');$('calendarView').classList.toggle('active',view==='calendar');
      if(view==='library')updateLibraryHeading();else{$('viewTitle').textContent=tr(view==='messages'?'messageArchive':'calendar');$('folderNote').hidden=true}
      if(view==='messages')renderMessages();if(view==='calendar')renderCalendar();
    }
    function renderCalendar(){
      var year=state.month.getFullYear(),month=state.month.getMonth();
      $('monthTitle').textContent=new Intl.DateTimeFormat(state.lang==='ar'?'ar-EG':'en-GB',{month:'long',year:'numeric'}).format(state.month);
      var first=new Date(year,month,1),start=new Date(first);start.setDate(first.getDate()-((first.getDay()-6+7)%7));
      var labels=state.lang==='ar'?['السبت','الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة']:['Sat','Sun','Mon','Tue','Wed','Thu','Fri'];
      var html=labels.map(function(label){return '<div class="weekday">'+label+'</div>'}).join('');
      var monthEvents=events.filter(function(event){var d=new Date(event.date+'T12:00:00');return d.getFullYear()===year&&d.getMonth()===month&&(!state.year||String(event.year)===state.year)});
      for(var i=0;i<42;i++){var day=new Date(start);day.setDate(start.getDate()+i);var iso=day.getFullYear()+'-'+String(day.getMonth()+1).padStart(2,'0')+'-'+String(day.getDate()).padStart(2,'0');var dayEvents=events.filter(function(event){return event.date===iso&&(!state.year||String(event.year)===state.year)});html+='<div class="day '+(day.getMonth()===month?'':'outside')+'"><span class="day-number">'+day.getDate()+'</span>'+dayEvents.slice(0,3).map(function(event){return '<button class="event '+esc(event.type||'')+' '+(event.archive?'archive':'')+'" data-event="'+esc(event.id)+'" title="'+esc(event.title)+'">'+esc(event.title)+'</button>'}).join('')+'</div>'}
      $('calendarGrid').innerHTML=html;
      $('agendaList').innerHTML=monthEvents.length?monthEvents.map(function(event){return '<div class="agenda-item"><time>'+esc(event.date)+(event.startTime?' · '+esc(event.startTime):'')+'</time><strong>'+esc(event.title)+'</strong><span>'+esc(event.module||'')+'</span></div>'}).join(''):'<p>'+esc(tr('noEvents'))+'</p>';
      $('calendarGrid').querySelectorAll('[data-event]').forEach(function(button){button.onclick=function(){var event=events.find(function(e){return e.id===button.dataset.event});var record=records.find(function(r){return r.id===event.sourceId});if(record){setView('library');selectRecord(record)}}});
    }
    function populateFilters(){
      $('yearFilter').innerHTML='<option value="">'+esc(tr('allYears'))+'</option>'+manifest.years.map(function(year){return '<option value="'+year.year+'">Year '+year.year+' · Batch '+year.effectiveBatch+'</option>'}).join('');
      var modules=[...new Set(records.map(function(record){return record.module}).filter(Boolean))].sort();
      $('moduleFilter').innerHTML='<option value="">'+esc(tr('allModules'))+'</option>'+modules.map(function(module){return '<option value="'+esc(module)+'">'+esc(module)+'</option>'}).join('');
      var doctors=[...new Set(records.map(function(record){return record.doctor}).filter(Boolean))].sort(function(a,b){return a.localeCompare(b)});
      $('doctorFilter').innerHTML='<option value="">'+esc(tr('allDoctors'))+'</option>'+doctors.map(function(doctor){return '<option value="'+esc(doctor)+'">Dr '+esc(doctor)+'</option>'}).join('');
      ['year','module','type','owner','doctor','cohort','flag','status'].forEach(function(key){var input=$(key+'Filter');if(input)input.value=state[key]||''});
    }
    function render(){
      updateLanguage();populateFilters();renderQuick();renderFolderTree();renderTree();renderResults();if(!state.selected){renderDetails(null);renderViewerEmpty()}setView(state.view);
    }
    $('search').oninput=function(){state.query=this.value;if(state.view==='messages')renderMessages();else renderResults()};
    $('yearFilter').onchange=function(){state.year=this.value;renderResults();if(state.view==='calendar')renderCalendar()};
    $('moduleFilter').onchange=function(){state.module=this.value;renderResults()};
    $('typeFilter').onchange=function(){state.type=this.value;renderResults()};
    $('ownerFilter').onchange=function(){state.owner=this.value;renderResults()};
    $('doctorFilter').onchange=function(){state.doctor=this.value;renderResults()};
    $('cohortFilter').onchange=function(){state.cohort=this.value;renderResults()};
    $('flagFilter').onchange=function(){state.flag=this.value;renderResults()};
    $('statusFilter').onchange=function(){state.status=this.value;renderResults()};
    $('lang').onclick=function(){state.lang=state.lang==='en'?'ar':'en';render()};
    $('libraryTab').onclick=function(){setView('library')};$('messagesTab').onclick=function(){setView('messages')};$('calendarTab').onclick=function(){setView('calendar')};
    $('prevMonth').onclick=function(){state.month=new Date(state.month.getFullYear(),state.month.getMonth()-1,1);renderCalendar()};
    $('nextMonth').onclick=function(){state.month=new Date(state.month.getFullYear(),state.month.getMonth()+1,1);renderCalendar()};
    $('prevFile').onclick=function(){var index=state.visible.findIndex(function(r){return r.id===state.selected});if(index>0)selectRecord(state.visible[index-1])};
    $('nextFile').onclick=function(){var index=state.visible.findIndex(function(r){return r.id===state.selected});if(index>=0&&index<state.visible.length-1)selectRecord(state.visible[index+1])};
    $('pageNumber').onchange=function(){var record=records.find(function(item){return item.id===state.selected});if(!record)return;var page=Math.max(1,Number(this.value)||1);saved.progress=saved.progress||{};saved.progress[stableId(record)]={page:page,updatedAt:new Date().toISOString()};persist();renderViewer(record);renderQuick()};
    $('favoriteFile').onclick=function(){var record=records.find(function(item){return item.id===state.selected});if(record)toggleFavorite(record)};
    $('organizeFile').onclick=function(){var record=records.find(function(item){return item.id===state.selected});if(record)openFileFolders(record)};
    $('newFolder').onclick=function(){var parentId=state.quick&&state.quick.indexOf('folder:')===0?state.quick.slice(7):null;openFolderModal(null,parentId)};
    $('saveFolder').onclick=saveFolder;$('deleteFolder').onclick=deleteFolder;$('saveFileFolders').onclick=saveFileFolders;
    document.querySelectorAll('[data-close-modal]').forEach(function(button){button.onclick=closeFolderModal});
    document.querySelectorAll('[data-close-file-folders]').forEach(function(button){button.onclick=function(){closeFileFolders()}});
    $('createFolderFromFile').onclick=function(){state.reopenFileFolders=true;closeFileFolders(false);openFolderModal(null,null)};
    $('folderModal').onclick=function(event){if(event.target===$('folderModal'))closeFolderModal()};
    $('fileFoldersModal').onclick=function(event){if(event.target===$('fileFoldersModal'))closeFileFolders()};
    $('openGuide').onclick=function(){location.href='_Library%20Guide%20%26%20Catalogs/README.md'};
    $('foldersToggle').onclick=function(){document.querySelector('.sidebar').classList.toggle('mobile-open')};
    $('detailsToggle').onclick=function(){var details=$('details');details.style.display=details.style.display==='block'?'none':'block'};
    document.addEventListener('keydown',function(event){if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='k'){event.preventDefault();$('search').focus()}if(event.key==='Escape'){if(!$('fileFoldersModal').hidden)closeFileFolders();else if(!$('folderModal').hidden)closeFolderModal();else if(document.querySelector('.sidebar').classList.contains('mobile-open'))document.querySelector('.sidebar').classList.remove('mobile-open');else if(state.view==='messages'&&state.messageHistory.length)backMessage();else $('search').blur()}});
    render();
  })();
  </script>
</body>
</html>
