<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#e8ecf4" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- page ground (a hint of the brand blue) + faint clinical-chart grid -->
  <rect width="1200" height="630" fill="#f5f7fb"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- the mark, faint, bleeding off the right edge.
       __MARK__ is replaced with a data URI by render.mjs, so the artwork stays
       the supplied PNG rather than a traced approximation. -->
  <g opacity="0.08">
    <image xlink:href="__MARK__" x="860" y="-40" width="700" height="700"/>
  </g>

  <!-- brand lockup: the mark IS the O in CONNECT, so the wordmark and the
       symbol are one thing rather than a symbol set beside a word. SVG has no
       inline flow to drop an image into a text run, so render.mjs composes the
       three pieces at measured glyph advances and substitutes them here. -->
  __LOCKUP__

  <!-- headline: the product's hero line -->
  <text x="90" y="348" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="bold" fill="#161920" letter-spacing="-2">See exactly what to</text>
  <text x="90" y="430" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="bold" fill="#161920" letter-spacing="-2">study next.</text>

  <!-- subline -->
  <text x="92" y="492" font-family="Helvetica, Arial, sans-serif" font-size="27" fill="#5d636f">A calm clinical workspace for undergraduate medicine.</text>

  <!-- footer rule + surfaces -->
  <line x1="92" y1="552" x2="1108" y2="552" stroke="#f4c8d6" stroke-width="1.5"/>
  <text x="92" y="590" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" letter-spacing="2.5" fill="#a82449">LIBRARY&#160;&#160;·&#160;&#160;QUESTION BANK&#160;&#160;·&#160;&#160;PRACTICAL&#160;&#160;·&#160;&#160;SCHEDULE</text>
</svg>
