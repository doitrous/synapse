<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#e8ecf4" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- page ground (a hint of the brand blue) + faint clinical-chart grid -->
  <rect width="1200" height="630" fill="#f5f7fb"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- the mark, faint, bleeding off the left edge — the card mirrors for RTL.
       __MARK__ is replaced with a data URI by render.mjs. -->
  <g opacity="0.06">
    <image xlink:href="__MARK__" x="-360" y="-40" width="700" height="700"/>
  </g>

  <!-- brand lockup, right-aligned so the card mirrors. The logotype itself
       stays LTR: it is a name, not running text, and the Arabic site sets it
       the same way. The text is anchored to the right margin and the mark sits
       to its left, clear of where the glyphs begin. -->
  <image xlink:href="__MARK__" x="472" y="86" width="84" height="84"/>
  <text x="1110" y="152" text-anchor="end" font-family="'Jost','Century Gothic','Futura','Avenir Next',Helvetica,Arial,sans-serif" font-size="56" font-weight="500" letter-spacing="2.5">
    <tspan fill="#1553b3">CONNECT</tspan><tspan fill="#d13a63">CORTEX</tspan>
  </text>

  <!-- Arabic headline (personalization motto), right-aligned -->
  <text x="1110" y="360" text-anchor="end" direction="rtl" font-family="'Geeza Pro','SF Arabic','Al Bayan','Baghdad','Noto Sans Arabic',Arial,sans-serif" font-size="96" font-weight="bold" fill="#161920">مذاكرة مفصلة عليك</text>

  <!-- Arabic subline -->
  <text x="1110" y="432" text-anchor="end" direction="rtl" font-family="'Geeza Pro','SF Arabic','Al Bayan','Noto Sans Arabic',Arial,sans-serif" font-size="30" fill="#5d636f">منصة دراسة سريرية لطلاب الطب، تتكيف مع تقدمك.</text>

  <!-- footer rule + Arabic surfaces -->
  <line x1="92" y1="552" x2="1108" y2="552" stroke="#f4c8d6" stroke-width="1.5"/>
  <text x="1108" y="592" text-anchor="end" direction="rtl" font-family="'Geeza Pro','SF Arabic','Al Bayan','Noto Sans Arabic',Arial,sans-serif" font-size="26" font-weight="bold" fill="#a82449">المكتبة  ·  بنك الأسئلة  ·  العملي السريري  ·  الجدول</text>
</svg>
