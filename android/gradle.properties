org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
kotlin.code.style=official

# KSP 2.2.10-2.0.2 (the only stable release built for Kotlin 2.2.10) adds its
# generated-sources directory through the legacy `kotlin.sourceSets` DSL,
# which AGP 9's built-in Kotlin support (used here instead of applying
# org.jetbrains.kotlin.android) hard-rejects with "Using kotlin.sourceSets
# DSL to add Kotlin sources is not allowed with built-in Kotlin." The fix
# landed in KSP's `main` and shipped starting with the 2.3.x line (which
# targets a newer Kotlin than the 2.2.10 this project is pinned to) — see
# https://github.com/google/ksp/issues/2729. There is no patched 2.2.10-2.0.x
# release. This flag is Android's own documented (if discouraged) escape
# hatch; remove it once either KSP backports the fix or the project's Kotlin
# version moves in lockstep with a fixed KSP release.
android.disallowKotlinSourceSets=false
