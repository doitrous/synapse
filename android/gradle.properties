org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# Room 2.6.1's KSP annotation processor emits DAO impls with malformed
# Continuation<T> generics (missing "? super") under KSP2, the default
# backend for Kotlin 2.1.20 / KSP 2.1.20-2.0.1. This breaks compilation of
# ANY suspend fun in a Room @Dao (reproduces even with plain Unit-returning
# methods, which crash KSP2 itself with "unexpected jvm signature V").
# Known upstream bug, fixed only in Room 2.7.0+: google/ksp#2957, #2177.
# Falling back to the legacy KSP1 backend avoids it without bumping Room.
# TODO: remove once Room is upgraded to 2.7.0+.
ksp.useKSP2=false
