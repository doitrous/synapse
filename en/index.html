<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f7fb" />
    <!-- Theme before first paint. Without this the page paints in the default
         palette and then corrects itself, which reads as a flash on every load.
         Kept in sync with THEME_STORAGE_KEY / THEME_COLOR in src/lib/useTheme.tsx. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('synapse-theme');
          if (t !== 'light' && t !== 'warm' && t !== 'dark') t = 'light';
          document.documentElement.dataset.theme = t;
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', { light: '#f5f7fb', warm: '#f7f2ea', dark: '#0d1117' }[t]);
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <meta
      name="description"
      content="Connect Cortex — a single clinical instrument for undergraduate medical study: library, question bank, practical, and a schedule that shows you exactly what to study next."
    />
    <title>Connect Cortex · Clinical study, in one place</title>

    <link rel="canonical" href="https://synapse.doitrous.com/en" />
    <link rel="alternate" hreflang="en" href="https://synapse.doitrous.com/en" />
    <link rel="alternate" hreflang="ar" href="https://synapse.doitrous.com/ar" />
    <link rel="alternate" hreflang="x-default" href="https://synapse.doitrous.com/" />

    <!-- Open Graph — WhatsApp, iMessage, Facebook, LinkedIn, Slack -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Connect Cortex" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ar_AR" />
    <meta property="og:title" content="Connect Cortex · See exactly what to study next" />
    <meta
      property="og:description"
      content="A calm clinical workspace for undergraduate medicine — library, question bank, practicals, and a schedule that shows you exactly what to study next."
    />
    <meta property="og:url" content="https://synapse.doitrous.com/en" />
    <meta property="og:image" content="https://synapse.doitrous.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Connect Cortex — see exactly what to study next" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Connect Cortex · See exactly what to study next" />
    <meta
      name="twitter:description"
      content="A calm clinical workspace for undergraduate medicine."
    />
    <meta name="twitter:image" content="https://synapse.doitrous.com/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
