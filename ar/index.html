<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f1e9" />
    <!-- Theme before first paint. Without this the page paints in the default
         palette and then corrects itself, which reads as a flash on every load.
         Kept in sync with THEME_STORAGE_KEY / THEME_COLOR in src/lib/useTheme.tsx. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('synapse-theme');
          if (t !== 'light' && t !== 'warm' && t !== 'dark') t = 'warm';
          document.documentElement.dataset.theme = t;
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', { light: '#f2f4f6', warm: '#f6f1e9', dark: '#17140f' }[t]);
        } catch (e) {
          document.documentElement.dataset.theme = 'warm';
        }
      })();
    </script>
    <meta
      name="description"
      content="مذاكرة مفصلة عليك. منصة دراسة سريرية هادئة لطلاب الطب — المكتبة وبنك الأسئلة والتدريب العملي وجدول يريك ما يستحق انتباهك اليوم."
    />
    <title>Synapse · مذاكرة مفصلة عليك</title>

    <link rel="canonical" href="https://synapse.doitrous.com/ar" />
    <link rel="alternate" hreflang="ar" href="https://synapse.doitrous.com/ar" />
    <link rel="alternate" hreflang="en" href="https://synapse.doitrous.com/en" />
    <link rel="alternate" hreflang="x-default" href="https://synapse.doitrous.com/" />

    <!-- Open Graph — WhatsApp, iMessage, Facebook, LinkedIn, Slack -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Synapse" />
    <meta property="og:locale" content="ar_AR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:title" content="Synapse · مذاكرة مفصلة عليك" />
    <meta
      property="og:description"
      content="منصة دراسة سريرية هادئة لطلاب الطب — المكتبة وبنك الأسئلة والتدريب العملي وجدول يريك ما يستحق انتباهك اليوم."
    />
    <meta property="og:url" content="https://synapse.doitrous.com/ar" />
    <meta property="og:image" content="https://synapse.doitrous.com/og-image-ar.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Synapse — مذاكرة مفصلة عليك" />

    <!-- Twitter / X -->

    />
    <meta name="twitter:image" content="https://synapse.doitrous.com/og-image-ar.png" />
  </head>

</html>
