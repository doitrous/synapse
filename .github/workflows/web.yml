# The web app: lint, types, tests, and the production build — and the server's
# own tests, which nothing ran before.
#
# The build is here deliberately. Coolify builds `main` to deploy it, so a
# commit that type-checks and tests but fails `vite build` would land green and
# break the deploy instead of the branch.
name: Web

on:
  pull_request:
    paths-ignore: ['ios/**', '.github/workflows/ios.yml', '**/*.md', 'docs/**']
  push:
    branches: [main]
    paths-ignore: ['ios/**', '.github/workflows/ios.yml', '**/*.md', 'docs/**']

permissions:
  contents: read

# A new push makes the previous run's answer irrelevant.
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `npm test` runs `node --test --experimental-strip-types`, which needs
      # Node 22.6 or newer. Pinned to the major the app is developed against
      # rather than `latest`, so a Node release cannot break CI on its own.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Types
        run: npx tsc -b

      - name: Tests
        run: npm test

      # The server has its own 234 tests and no job was running them. Among
      # them are the guards that keep a student from receiving unpublished
      # drafts, author notes, and the provenance of the papers questions were
      # taken from — so the one suite that enforces a confidentiality boundary
      # was the one suite that could break unnoticed.
      #
      # `npm ci` in `server/` because its dependencies are its own; the root
      # install does not reach them.
      - name: Server tests
        run: npm ci && npm test
        working-directory: server

      # `npm run build` is `tsc -b && vite build`; the types step above already
      # ran, so a failure here is the bundle itself.
      - name: Build
        run: npm run build
