# The authored content under `docs/Kasr-Source-Imports/`.
#
# The web workflow ignores `docs/**` and `**/*.md`, which was right when docs
# were prose. They are not any more: the extraction programme puts thousands of
# exam questions there as Markdown batches, and a batch that fails the importer
# fails silently at 2am in an admin's browser rather than loudly on a pull
# request. This job is that pull request.
#
# It is deliberately not the web job with a wider trigger. A README edit should
# not run `vite build`; a batch edit should not need to.
name: Content

on:
  pull_request:
    paths: ['docs/Kasr-Source-Imports/**', 'scripts/kasr/**', 'scripts/validate-content-batch.mjs']
  push:
    branches: [main]
    paths: ['docs/Kasr-Source-Imports/**', 'scripts/kasr/**', 'scripts/validate-content-batch.mjs']

permissions:
  contents: read

concurrency:
  group: content-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Citations and batches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # Every `src_`-prefixed token under the import root must name a real
      # manifest row. Two shipped documents cited IDs that named no file, and
      # nothing noticed because a citation is only load-bearing when a reviewer
      # tries to follow it — by which point they cannot find the page.
      - name: Manifest citations
        run: npm run medical:citations

      # A batch that no longer exists passes every other check here: the batch
      # validator inspects what it is handed, the citation check finds no
      # unresolvable token in a file that is not there, and the field audit
      # cannot report a blank field on an absent record. Two written batches
      # were deleted from `main` by commits about other modules, naming
      # neither, and both losses surfaced by accident. Each module's coverage
      # ledger records the batches it had when it was known good; this fails
      # when the tree is short of that.
      - name: Every batch its ledger names
        run: npm run medical:batches-present

      # Two ids that mean one concept. The mint hashes the canonical key alone
      # and the subject only picks the `CON-<SYS>-` prefix, so one key filed
      # under two subjects gives two ids that differ in three characters and
      # nothing at import time notices — a student's mastery of one idea splits
      # across both. Two sessions author this module, and their seeds are not
      # always in one checkout; the committed batches always are.
      - name: One idea, one concept
        run: npm run medical:concept-ids

      # A concept ID is what every claim, span, question and article points at,
      # so one moving forks a student's mastery across two records with nothing
      # at import time noticing. This pins the committed ID of one concept per
      # module — not `id === mintConceptId(...)`, which holds for 101 and 102
      # and for none of 103, 104 or 108, and would make this red on day one.
      - name: Concept IDs have not moved
        run: npm run medical:id-stability

      # Every batch is checked against every concept and article batch as a
      # sibling. A question and a practical both resolve their concepts against
      # live state, deliberately — an item pointing at a concept nobody authored
      # is the failure that check exists to catch — but a programme authoring
      # all four kinds in one pass has none of them imported yet.
      # The audit asks two questions of a concept — is the field populated, and
      # does the key exist at all — and it runs against the live ledger, so it
      # cannot see a batch until someone has imported it. This asks the same two
      # questions of the batch, which is when the answer is wanted.
      - name: Concept field presence
        run: npm run medical:presence

      - name: Validate every batch
        run: |
          set -e
          concepts=$(ls docs/Kasr-Source-Imports/concept/*.md 2>/dev/null || true)
          articles=$(ls docs/Kasr-Source-Imports/article/*.md 2>/dev/null || true)
          # Evidence too. A question may cite the paper it was taken from, and
          # that citation only resolves if the resource record is a sibling —
          # otherwise a batch that is right fails here for naming its own
          # source, and the only way to pass is to drop the provenance.
          evidence=$(ls docs/Kasr-Source-Imports/evidence/*.md 2>/dev/null || true)
          siblings=""
          for file in $concepts $articles $evidence; do siblings="$siblings --with $file"; done

          failed=0
          for file in docs/Kasr-Source-Imports/*/*.md; do
            case "$file" in
              */manifest/*|*/INDEX.md|*/academic/*|*/coverage/*|*/media-requests/*) continue ;;
            esac
            echo "--- $file"
            npm run -s medical:batch -- "$file" $siblings || failed=1
          done
          exit $failed
