<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MCQ Viz</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --border: #dcdcd7; --text: #1c1c1a;
    --muted: #6b6b66; --accent: #2454b8; --accent-bg: #e8eefb;
    --correct: #1c7a3d; --correct-bg: #e3f5e9; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--text); background: var(--bg);
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 16px; padding: 8px 14px;
    background: var(--panel); border-bottom: 1px solid var(--border); flex: 0 0 auto;
  }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; }
  header .totals { font-size: 12px; color: var(--muted); display: flex; gap: 14px; }
  header .totals b { color: var(--text); }
  .layout { flex: 1 1 auto; display: flex; min-height: 0; }
  .panel { overflow-y: auto; height: 100%; }
  #tree-panel { width: 280px; flex: 0 0 280px; border-right: 1px solid var(--border); background: var(--panel); padding: 8px; }
  #list-panel { width: 420px; flex: 0 0 420px; border-right: 1px solid var(--border); background: var(--bg); }
  #pdf-panel { flex: 1 1 auto; background: #e9e9e6; display: flex; flex-direction: column; }

  /* Tree */
  .node { user-select: none; }
  .node-row { display: flex; align-items: center; gap: 6px; padding: 3px 4px; border-radius: 4px; cursor: pointer; }
  .node-row:hover { background: var(--accent-bg); }
  .node-row.selected { background: var(--accent-bg); font-weight: 600; }
  .node-children { margin-left: 16px; }
  .twisty { width: 12px; display: inline-block; color: var(--muted); font-size: 10px; }
  .badge { margin-left: auto; font-size: 11px; color: var(--muted); background: #eee; border-radius: 10px; padding: 0 6px; }
  .node-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .node-name.source { font-family: var(--mono); font-size: 12px; }

  /* Middle list */
  #list-header { position: sticky; top: 0; background: var(--panel); border-bottom: 1px solid var(--border); padding: 10px 12px; z-index: 1; }
  #list-header .src-title { font-weight: 600; font-size: 13px; }
  #list-header .src-meta { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
  #list-header .histogram { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 4px; }
  #mcq-list { padding: 8px; display: flex; flex-direction: column; gap: 8px; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 12px; cursor: pointer;
  }
  .card:hover { border-color: var(--accent); }
  .card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); background: var(--accent-bg); }
  .card .card-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .card .id { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .card .title { font-weight: 600; font-size: 13px; margin: 4px 0 4px; }
  .card .question { font-size: 13px; margin-bottom: 6px; }
  .card .opts { display: flex; flex-direction: column; gap: 2px; margin-bottom: 6px; }
  .card .opt { font-size: 12.5px; padding: 2px 6px; border-radius: 3px; }
  .card .opt.correct { background: var(--correct-bg); color: var(--correct); font-weight: 600; }
  .card .opt b { font-family: var(--mono); margin-right: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .chip { font-size: 10.5px; background: #eee; color: var(--muted); border-radius: 8px; padding: 1px 7px; }
  details.expl { margin-top: 6px; font-size: 12px; }
  details.expl summary { cursor: pointer; color: var(--accent); }
  details.expl .ex-line { margin-top: 4px; }
  details.expl .ex-line b { font-family: var(--mono); }
  .empty-msg { padding: 24px; color: var(--muted); text-align: center; font-size: 13px; }
  .load-more { display: block; width: calc(100% - 4px); margin: 4px 2px 2px; padding: 8px; font: inherit;
    background: var(--panel); border: 1px dashed var(--border); border-radius: 6px; color: var(--accent); cursor: pointer; }
  .load-more:hover { background: var(--accent-bg); border-style: solid; }

  /* PDF panel */
  #pdf-toolbar {
    display: flex; align-items: center; gap: 10px; padding: 6px 10px;
    background: var(--panel); border-bottom: 1px solid var(--border); flex: 0 0 auto; font-size: 12px;
  }
  #pdf-toolbar button { font: inherit; padding: 3px 9px; border: 1px solid var(--border); background: #fff; border-radius: 4px; cursor: pointer; }
  #pdf-toolbar button:disabled { opacity: .4; cursor: default; }
  #pdf-note { color: var(--muted); font-style: italic; }
  #pdf-scroll { flex: 1 1 auto; overflow: auto; display: flex; justify-content: center; padding: 16px; }
  #pdf-stage { position: relative; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.2); height: fit-content; }
  #pdf-stage canvas { display: block; }
  .hl-box { position: absolute; background: rgba(255, 214, 0, .45); border: 1px solid rgba(200, 150, 0, .8); pointer-events: none; }
  #pdf-placeholder { margin: auto; color: var(--muted); text-align: center; padding: 40px; max-width: 320px; }
</style>
</head>
<body>
<header>
  <h1>MCQ Viz</h1>
  <div class="totals" id="totals-bar">loading&hellip;</div>
</header>
<div class="layout">
  <div id="tree-panel" class="panel"></div>
  <div id="list-panel" class="panel">
    <div id="list-header"></div>
    <div id="mcq-list"></div>
  </div>
  <div id="pdf-panel">
    <div id="pdf-toolbar">
      <button id="pdf-prev">&larr; prev</button>
      <span id="pdf-pageinfo">&mdash;</span>
      <button id="pdf-next">next &rarr;</button>
      <span id="pdf-note"></span>
    </div>
    <div id="pdf-scroll">
      <div id="pdf-placeholder">Select an MCQ to view its source PDF.</div>
    </div>
  </div>
</div>

<script type="module">
import * as pdfjsLib from './vendor/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc = './vendor/pdf.worker.min.mjs';

let DATA = null;
let selectedFilter = null;   // { kind: 'folder'|'source', srcIds: Set }
let selectedMcqId = null;
let pdfDoc = null;
let pdfDocSrcId = null;
let curPage = 1;
let curStem = null;
let renderToken = 0;
// Incremental list rendering — never build all 1419 cards at once.
const LIST_BATCH = 25;
let listQueue = [];
let listScrollHandler = null;

const $ = (sel) => document.querySelector(sel);
const treeEl = $('#tree-panel');
const listHeaderEl = $('#list-header');
const listEl = $('#mcq-list');
const totalsEl = $('#totals-bar');
const pdfScroll = $('#pdf-scroll');
const pdfPrev = $('#pdf-prev');
const pdfNext = $('#pdf-next');
const pdfPageInfo = $('#pdf-pageinfo');
const pdfNote = $('#pdf-note');

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function loadData() {
  for (const url of ['./mcq-index.json', './sample-index.json']) {
    try {
      const res = await fetch(url);
      if (res.ok) return await res.json();
    } catch (e) { /* try next */ }
  }
  throw new Error('no index available');
}

function allSrcIds() {
  return new Set(DATA.sources.map((s) => s.srcId));
}

function collectSrcIds(node, out) {
  if (node.type === 'source') { out.add(node.srcId); }
  else if (node.children) { for (const c of node.children) collectSrcIds(c, out); }
  return out;
}

function renderTree() {
  treeEl.innerHTML = '';
  const root = document.createElement('div');
  for (const node of DATA.tree) root.appendChild(renderNode(node, 0));
  treeEl.appendChild(root);
}

function renderNode(node) {
  const wrap = document.createElement('div');
  wrap.className = 'node';
  const row = document.createElement('div');
  row.className = 'node-row';
  const isFolder = node.type === 'folder';
  const twisty = document.createElement('span');
  twisty.className = 'twisty';
  twisty.textContent = isFolder ? '▸' : ''; // collapsed by default
  row.appendChild(twisty);
  const name = document.createElement('span');
  name.className = 'node-name' + (isFolder ? '' : ' source');
  name.textContent = node.name;
  row.appendChild(name);
  const badge = document.createElement('span');
  badge.className = 'badge';
  badge.textContent = node.mcqCount;
  row.appendChild(badge);

  let childrenEl = null;
  let built = false; // children rendered lazily on first expand — keeps the load-time DOM tiny
  if (isFolder) {
    childrenEl = document.createElement('div');
    childrenEl.className = 'node-children';
    childrenEl.style.display = 'none';
    const expand = () => {
      if (!built) { for (const c of node.children) childrenEl.appendChild(renderNode(c)); built = true; }
      childrenEl.style.display = '';
      twisty.textContent = '▾';
    };
    const collapse = () => { childrenEl.style.display = 'none'; twisty.textContent = '▸'; };
    row._expand = expand;
    twisty.addEventListener('click', (e) => {
      e.stopPropagation();
      childrenEl.style.display === 'none' ? expand() : collapse();
    });
  }

  row.dataset.nodeKind = node.type;
  row.addEventListener('click', () => {
    document.querySelectorAll('.node-row.selected').forEach((el) => el.classList.remove('selected'));
    row.classList.add('selected');
    if (isFolder && childrenEl.style.display === 'none') row._expand();
    const ids = isFolder ? collectSrcIds(node, new Set()) : new Set([node.srcId]);
    selectedFilter = { kind: node.type, srcIds: ids, label: node.name };
    selectedMcqId = null;
    renderList();
  });

  wrap.appendChild(row);
  if (childrenEl) wrap.appendChild(childrenEl);
  return wrap;
}

function currentMcqs() {
  if (!selectedFilter) return [];
  return DATA.mcqs.filter((m) => selectedFilter.srcIds.has(m.srcId));
}

function renderListHeader() {
  if (!selectedFilter) { listHeaderEl.innerHTML = ''; return; }
  const mcqs = currentMcqs();
  if (selectedFilter.kind === 'source') {
    const src = DATA.sources.find((s) => selectedFilter.srcIds.has(s.srcId));
    const hist = src.pageHistogram || {};
    const histStr = Object.keys(hist).sort((a, b) => {
      if (a === 'unknown') return 1; if (b === 'unknown') return -1;
      return Number(a) - Number(b);
    }).map((k) => `${k === 'unknown' ? 'unknown' : 'p' + k}: ${hist[k]}`).join(' · ');
    listHeaderEl.innerHTML = `
      <div class="src-title">${esc(src.title)}</div>
      <div class="src-meta">${mcqs.length} MCQ${mcqs.length === 1 ? '' : 's'} &middot; ${esc(src.module)} &middot; ${src.pdfFound ? 'PDF found' : 'PDF missing'}</div>
      <div class="histogram">${esc(histStr || '(no pages recorded)')}</div>`;
  } else {
    listHeaderEl.innerHTML = `
      <div class="src-title">${esc(selectedFilter.label)}</div>
      <div class="src-meta">${mcqs.length} MCQ${mcqs.length === 1 ? '' : 's'} across ${selectedFilter.srcIds.size} source(s)</div>`;
  }
}

function optionRow(letter, text, correct) {
  return `<div class="opt${correct ? ' correct' : ''}"><b>${letter}.</b>${esc(text)}${correct ? ' ✓' : ''}</div>`;
}

function makeCard(m) {
  const card = document.createElement('div');
  card.className = 'card' + (m.id === selectedMcqId ? ' selected' : '');
  card.dataset.mcqId = m.id;
  const pageChip = m.page != null ? `p.${m.page}` : 'page n/a';
  const opts = ['A', 'B', 'C', 'D'].map((k) => optionRow(k, m.options[k], m.correct === k)).join('');
  const expl = ['A', 'B', 'C', 'D'].map((k) =>
    `<div class="ex-line"><b>${k}.</b> ${esc(m.explanations?.[k] ?? '')}</div>`).join('');
  card.innerHTML = `
    <div class="card-top"><span class="id">${esc(m.id)}</span></div>
    <div class="title">${esc(m.title)}</div>
    <div class="question">${esc(m.question)}</div>
    <div class="opts">${opts}</div>
    <div class="chips">
      <span class="chip">${esc(pageChip)}</span>
      <span class="chip">${esc(m.topic || '')}${m.subtopic ? ' / ' + esc(m.subtopic) : ''}</span>
      <span class="chip">${esc(m.difficulty || '')}</span>
      <span class="chip">${esc(m.concept || '')}</span>
    </div>
    <details class="expl"><summary>Explanations</summary>${expl}</details>`;
  card.addEventListener('click', (e) => {
    if (e.target.closest('details')) return;
    document.querySelectorAll('.card.selected').forEach((el) => el.classList.remove('selected'));
    card.classList.add('selected');
    selectedMcqId = m.id;
    openMcq(m);
  });
  return card;
}

// Render the current selection lazily: draw one batch, then top up as the user
// nears the bottom. Keeps the DOM small even for a folder spanning hundreds of
// MCQs. A plain scroll listener (not IntersectionObserver) — boring and works.
function renderList() {
  renderListHeader();
  const panel = listEl.parentElement;
  if (listScrollHandler) { panel.removeEventListener('scroll', listScrollHandler); listScrollHandler = null; }
  listEl.innerHTML = '';
  const mcqs = currentMcqs();
  if (!selectedFilter) {
    listEl.innerHTML = '<div class="empty-msg">Select a source (or folder) on the left to load its MCQs.</div>';
    return;
  }
  if (!mcqs.length) {
    listEl.innerHTML = '<div class="empty-msg">No MCQs in this selection.</div>';
    return;
  }
  listQueue = mcqs.slice();
  panel.scrollTop = 0;
  appendBatch();
  // Convenience: auto-append as the user nears the bottom. The "Load more"
  // button appendBatch renders is the guarantee — access never depends on a
  // scroll event firing.
  listScrollHandler = () => {
    if (panel.scrollHeight - panel.scrollTop - panel.clientHeight < 600) appendBatch();
  };
  panel.addEventListener('scroll', listScrollHandler);
}

function appendBatch() {
  if (!listQueue.length) return;
  const oldBtn = document.getElementById('load-more');
  if (oldBtn) oldBtn.remove();
  const slice = listQueue.splice(0, LIST_BATCH);
  const frag = document.createDocumentFragment();
  for (const m of slice) frag.appendChild(makeCard(m));
  listEl.appendChild(frag);
  if (listQueue.length) {
    const b = document.createElement('button');
    b.id = 'load-more';
    b.className = 'load-more';
    b.textContent = `Load more (${listQueue.length} remaining)`;
    b.addEventListener('click', appendBatch);
    listEl.appendChild(b);
  }
}

function renderTotals() {
  const t = DATA.totals || {};
  const pdfs = t.sourcesResolved ?? t.sources ?? 0;
  totalsEl.innerHTML = `<span><b>${t.universities ?? '—'}</b> universities</span><span><b>${t.mcqs ?? 0}</b> MCQs</span><span><b>${pdfs}</b> PDFs</span><span><b>${t.held ?? 0}</b> held</span>`;
}

// ---- PDF pane ----

function normalize(s) {
  return String(s || '').toLowerCase().replace(/\s+/g, ' ').replace(/:\s*$/, '').trim();
}

function showPlaceholder(msg) {
  pdfScroll.innerHTML = `<div id="pdf-placeholder">${esc(msg)}</div>`;
  pdfPageInfo.textContent = '—';
  pdfNote.textContent = '';
  pdfPrev.disabled = pdfNext.disabled = true;
}

async function ensurePdf(src) {
  if (!src.pdfFound || !src.pdfUrl) return null;
  if (pdfDoc && pdfDocSrcId === src.srcId) return pdfDoc;
  // Release the previous document so PDF memory doesn't pile up across sources.
  if (pdfDoc) { try { await pdfDoc.destroy(); } catch (e) { /* ignore */ } pdfDoc = null; pdfDocSrcId = null; }
  const url = '/' + src.pdfUrl;
  const doc = await pdfjsLib.getDocument(url).promise;
  pdfDoc = doc;
  pdfDocSrcId = src.srcId;
  return doc;
}

// PDF.js text items are sometimes per-glyph, not per-word, so we can't just
// join(' ') them (that inserts a space between every letter). Build a
// character-level index instead: concatenate raw chars, collapse whitespace
// while keeping a map back to which item owned each surviving char.
function buildSearchIndex(items) {
  let raw = '';
  const charMap = [];
  for (let i = 0; i < items.length; i++) {
    for (const ch of items[i].str) { raw += ch; charMap.push(i); }
  }
  let norm = '';
  const normMap = [];
  let lastWasSpace = true;
  for (let i = 0; i < raw.length; i++) {
    let ch = raw[i].toLowerCase();
    if (/\s/.test(ch)) {
      if (lastWasSpace) continue;
      ch = ' '; lastWasSpace = true;
    } else { lastWasSpace = false; }
    norm += ch; normMap.push(charMap[i]);
  }
  while (norm.endsWith(' ')) { norm = norm.slice(0, -1); normMap.pop(); }
  return { norm, normMap };
}

function findMatchItems(items, target) {
  if (!target) return null;
  const { norm, normMap } = buildSearchIndex(items);
  const idx = norm.indexOf(target);
  if (idx === -1) return null;
  const startItem = normMap[idx];
  const endItem = normMap[Math.min(idx + target.length - 1, normMap.length - 1)];
  return items.slice(startItem, endItem + 1);
}

async function findStemPage(doc, stem, hintPage) {
  const target = normalize(stem);
  if (!target) return { page: hintPage || 1, found: false };
  const order = [];
  if (hintPage) order.push(hintPage);
  for (let p = 1; p <= doc.numPages; p++) if (p !== hintPage) order.push(p);
  for (const p of order) {
    const page = await doc.getPage(p);
    const content = await page.getTextContent();
    if (!content.items.length) continue;
    const { norm } = buildSearchIndex(content.items);
    if (norm.includes(target)) return { page: p, found: true };
  }
  return { page: hintPage || 1, found: false };
}

async function renderPage(doc, pageNum, stem) {
  const myToken = ++renderToken;
  curPage = pageNum;
  const page = await doc.getPage(pageNum);
  const viewport = page.getViewport({ scale: 1.4 });

  pdfScroll.innerHTML = `<div id="pdf-stage" style="width:${viewport.width}px;height:${viewport.height}px">
    <canvas width="${viewport.width}" height="${viewport.height}"></canvas>
  </div>`;
  const canvas = pdfScroll.querySelector('canvas');
  const ctx = canvas.getContext('2d');
  await page.render({ canvasContext: ctx, viewport }).promise;
  if (myToken !== renderToken) return;

  pdfPageInfo.textContent = `page ${pageNum} of ${doc.numPages}`;
  pdfPrev.disabled = pageNum <= 1;
  pdfNext.disabled = pageNum >= doc.numPages;

  const content = await page.getTextContent();
  if (myToken !== renderToken) return;
  if (!content.items.length) {
    pdfNote.textContent = 'position unavailable (scanned or no text match)';
    return;
  }

  const target = normalize(stem);
  if (!target) { pdfNote.textContent = ''; return; }

  const match = findMatchItems(content.items, target);
  if (!match || !match.length) {
    pdfNote.textContent = 'position unavailable (scanned or no text match)';
    return;
  }
  pdfNote.textContent = '';
  const stage = $('#pdf-stage');
  for (const box of computeLineBoxes(match, viewport)) {
    const el = document.createElement('div');
    el.className = 'hl-box';
    el.style.left = box.x + 'px';
    el.style.top = box.y + 'px';
    el.style.width = Math.max(box.w, 2) + 'px';
    el.style.height = Math.max(box.h, 8) + 'px';
    stage.appendChild(el);
  }
}

// Merge per-glyph/per-word item boxes into one highlight rect per visual
// line, so a multi-line stem draws a few clean bars instead of dozens of
// tiny per-character boxes.
function computeLineBoxes(items, viewport) {
  const glyphs = items.map((item) => {
    const tr = pdfjsLib.Util.transform(viewport.transform, item.transform);
    const x = tr[4];
    const y = tr[5] - Math.hypot(tr[2], tr[3]);
    const w = Math.hypot(tr[0], tr[1]) * item.width;
    const h = Math.hypot(tr[2], tr[3]) * 1.15; // tr[2]/tr[3] are already the viewport-scaled glyph height
    return { x, y, w, h, bottom: tr[5] };
  });
  const lines = [];
  for (const g of glyphs) {
    let line = lines.find((l) => Math.abs(l.bottom - g.bottom) < 3);
    if (!line) { line = { bottom: g.bottom, x0: g.x, x1: g.x + g.w, y: g.y, h: g.h }; lines.push(line); }
    else {
      line.x0 = Math.min(line.x0, g.x);
      line.x1 = Math.max(line.x1, g.x + g.w);
      line.y = Math.min(line.y, g.y);
      line.h = Math.max(line.h, g.h);
    }
  }
  return lines.map((l) => ({ x: l.x0, y: l.y, w: l.x1 - l.x0, h: l.h }));
}

async function openMcq(m) {
  const src = DATA.sources.find((s) => s.srcId === m.srcId);
  if (!src) { showPlaceholder('Source not found.'); return; }
  if (!src.pdfFound || !src.pdfUrl) {
    showPlaceholder('PDF not found on disk.\n\n' + src.title);
    return;
  }
  showPlaceholder('Loading PDF…');
  try {
    const doc = await ensurePdf(src);
    curStem = m.stem;
    const hint = m.page || 1;
    if (m.page) {
      await renderPage(doc, m.page, m.stem);
      // If not found on the hinted page, search the whole doc.
      if (pdfNote.textContent) {
        const res = await findStemPage(doc, m.stem, m.page);
        if (res.found && res.page !== m.page) await renderPage(doc, res.page, m.stem);
      }
    } else {
      const res = await findStemPage(doc, m.stem, null);
      await renderPage(doc, res.page, m.stem);
    }
  } catch (err) {
    console.error(err);
    showPlaceholder('Failed to load PDF: ' + err.message);
  }
}

pdfPrev.addEventListener('click', () => { if (pdfDoc && curPage > 1) renderPage(pdfDoc, curPage - 1, curStem); });
pdfNext.addEventListener('click', () => { if (pdfDoc && curPage < pdfDoc.numPages) renderPage(pdfDoc, curPage + 1, curStem); });

(async function init() {
  try {
    DATA = await loadData();
  } catch (e) {
    totalsEl.textContent = 'Failed to load index: ' + e.message;
    return;
  }
  renderTotals();
  renderTree();
  // Nothing heavy on load — no cards, no PDF. The list renders only once a
  // source/folder is picked. (allSrcIds kept for a possible "show all" later.)
  void allSrcIds;
  renderList();
})();
</script>
</body>
</html>
