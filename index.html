<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f1e9" />
    <!-- Theme before first paint. Without this the page paints in the default
         palette and then corrects itself, which reads as a flash on every load.
         Kept in sync with THEME_STORAGE_KEY / THEME_COLOR in src/lib/useTheme.tsx. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('synapse-theme');
          if (t !== 'light' && t !== 'warm' && t !== 'dark') t = 'warm';
          document.documentElement.dataset.theme = t;
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', { light: '#f2f4f6', warm: '#f6f1e9', dark: '#17140f' }[t]);
        } catch (e) {
          document.documentElement.dataset.theme = 'warm';
        }
      })();
    </script>
    <meta
      name="description"
      content="Synapse — a single clinical instrument for undergraduate medical study: library, question bank, practical, and a schedule that shows you exactly what to study next."
    />
    <title>Synapse · Clinical study, in one place</title>

    <link rel="canonical" href="https://synapse.doitrous.com/" />
    <link rel="alternate" hreflang="en" href="https://synapse.doitrous.com/en" />
    <link rel="alternate" hreflang="ar" href="https://synapse.doitrous.com/ar" />
    <link rel="alternate" hreflang="x-default" href="https://synapse.doitrous.com/" />

    <!-- Open Graph — WhatsApp, iMessage, Facebook, LinkedIn, Slack -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Synapse" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ar_AR" />
    <meta property="og:title" content="Synapse · See exactly what to study next" />
    <meta
      property="og:description"
      content="A calm clinical workspace for undergraduate medicine — library, question bank, practicals, and a schedule that shows you exactly what to study next."
    />
    <meta property="og:url" content="https://synapse.doitrous.com/" />
    <meta property="og:image" content="https://synapse.doitrous.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Synapse — see exactly what to study next" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Synapse · See exactly what to study next" />
    <meta
      name="twitter:description"
      content="A calm clinical workspace for undergraduate medicine."
    />
    <meta name="twitter:image" content="https://synapse.doitrous.com/og-image.png" />
  </head>
  <body>
    <!--
      DIRECTION CONTRACT · Synapse · seed:user-pinned/clinical-chart
      THESIS: One calm clinical instrument where a med student reads, drills, practices, and sees what to study next. Refuses the multi-tab SaaS grid of same-size icon cards.
      OWN-WORLD: Cool clinical-paper ground on a faint ruled vitals-chart grid; surgical-teal accent; Source Serif 4 headings + Geist UI + Geist Mono data; calibrated reference-range meters; hairline rules; no glass, gradients, or glow.
      STORY: Student lands, sees what is next and what is slipping, and acts in one click into review, qbank, or library.
      FIRST VIEWPORT: Serif greeting and date rail; "Next on your schedule" prominent left, exam-readiness meter right; progress trio beneath; all seated on the chart grid.
      FORM: User-pinned direction (Editorial-Clinical → Clinical Chart). No concept roll.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
