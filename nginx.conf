server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed, immutable build assets — cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache the HTML shell, so a new deploy is picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Localized entry points — /en and /ar serve their own HTML so link
    # crawlers (WhatsApp, iMessage, …) get the right Open Graph card and
    # lang/dir per locale. Served directly (no redirect), never cached.
    location = /en {
        add_header Cache-Control "no-cache";
        try_files /en/index.html =404;
    }
    location = /ar {
        add_header Cache-Control "no-cache";
        try_files /ar/index.html =404;
    }

    # SPA fallback: any unmatched path serves index.html so react-router
    # (createBrowserRouter) can handle /app, /admin/... on refresh & deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
